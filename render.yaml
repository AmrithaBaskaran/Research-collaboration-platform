services:
  - type: web
    name: flask-project-tracker
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: flask db upgrade && python seed_demo_data.py && gunicorn main:app
    envVars:
      - key: FLASK_APP
        value: main.py
      - key: APP_SETTINGS
        value: config.ProductionConfig
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: project-tracker-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: uploads
      - key: PYTHON_VERSION
        value: 3.12.2

databases:
  - name: project-tracker-db
    plan: free
    databaseName: project_tracker
    user: project_tracker_user
