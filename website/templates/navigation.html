<link
    rel="stylesheet"
    href="{{ url_for('static', filename='styles/base/navigation.css') }}"
/>

<header class="py-2 bg-white border-bottom shadow-sm">
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-light py-0">
            <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2 me-4" href="{{ url_for('core.home') }}">
                <i class="bi bi-mortarboard-fill"></i>
                <span>Research Collab</span>
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                {% if current_user.is_authenticated %}
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="{{ url_for('core.home') }}" class="nav-link">
                            <i class="bi bi-grid me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('projects.projects') }}" class="nav-link">
                            <i class="bi bi-folder2 me-1"></i> My Projects
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('projects.public_projects') }}" class="nav-link">
                            <i class="bi bi-compass me-1"></i> Explore Research
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('projects.join_requests') }}" class="nav-link">
                            <i class="bi bi-people me-1"></i> Requests
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('accounts.profile') }}" class="nav-link">
                            <i class="bi bi-person me-1"></i> Profile
                        </a>
                    </li>
                </ul>
                {% else %}
                <ul class="navbar-nav me-auto mb-2 mb-lg-0"></ul>
                {% endif %}

                <div class="text-end d-flex align-items-center gap-2">
                    {% if current_user.is_authenticated %}
                    <span class="text-muted small me-2 d-none d-md-inline">
                        {{ current_user.email }}
                    </span>
                    <a
                        href="{{ url_for('accounts.logout') }}"
                        class="btn btn-sm btn-outline-danger"
                    >
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </a>
                    {% else %}
                    <a
                        href="{{ url_for('accounts.login') }}"
                        class="btn btn-outline-primary btn-sm me-2"
                    >
                        Login
                    </a>
                    <a
                        href="{{ url_for('accounts.register') }}"
                        class="btn btn-primary btn-sm"
                    >
                        Sign up
                    </a>
                    {% endif %}
                </div>
            </div>
        </nav>
    </div>
</header>
